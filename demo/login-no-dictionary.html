<!doctype html>
<html lang="vi" class="width100% height100%">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Login - No Dictionary</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    input,
    button,
    select {
      font: inherit;
    }
  </style>
</head>

<body
  class="margin0 width100% height100% background-color#ececec displayFlex align-itemsCenter justify-contentCenter font-familySegoe;UI,Tahoma,Arial,sans-serif">
  <div
    class="positionFixed top14px left14px padding6px;10px border-radius999px border1px;solid;#ffd3ba background-color#fff3eb color#c35d1e font-size12px font-weight600 line-height1 z-index9">
    dictionaryImport = false
  </div>

  <div class="displayFlex flex-directionColumn align-itemsCenter width100%">
    <section
      class="width410px background-color#f8f8f8 border1px;solid;#8f8f8f border-radius20px padding28px;24px;24px box-shadow0;1px;0;rgba(0,0,0,0.02)">
      <div class="displayFlex justify-contentCenter margin-bottom20px">
        <div
          class="width106px height40px displayFlex align-itemsCenter justify-contentCenter background-color#181d25 color#ffffff font-weight700 font-size28px border-radius2px letter-spacing0.2px text-transformLowercase">
          # slack
        </div>
      </div>

      <h1 class="margin0 margin-bottom22px text-alignCenter color#444444 font-weight500 font-size50px line-height1.05">
        Đăng nhập</h1>

      <div class="displayFlex gap10px margin-bottom12px">
        <button type="button"
          class="width92px height40px displayFlex align-itemsCenter justify-contentSpace-between padding-left14px padding-right12px border1px;solid;#adadad border-radius6px background-color#f5f5f5 color#545454 font-size16px cursorPointer">
          <span>+84</span>
          <span>▼</span>
        </button>

        <input type="text"
          class="flex1 height40px padding-left14px padding-right12px border1px;solid;#adadad border-radius6px background-color#f5f5f5 color#505050 font-size16px"
          placeholder="Nhập email hoặc số điện thoại" />
      </div>

      <div class="positionRelative margin-bottom16px">
        <input type="password"
          class="width100% height40px padding-left14px padding-right44px border1px;solid;#adadad border-radius6px background-color#f5f5f5 color#505050 font-size16px"
          placeholder="Nhập mật khẩu" />

        <button type="button" aria-label="Hiện mật khẩu"
          class="positionAbsolute top50% right12px transformTranslateY(-50%) width24px height24px displayFlex align-itemsCenter justify-contentCenter padding0 borderNone background-colorTransparent cursorPointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M2 12C3.7 8.8 7.4 6.5 12 6.5C16.6 6.5 20.3 8.8 22 12C20.3 15.2 16.6 17.5 12 17.5C7.4 17.5 3.7 15.2 2 12Z"
              stroke="#5b5b5b" stroke-width="1.8" />
            <circle cx="12" cy="12" r="3.1" stroke="#5b5b5b" stroke-width="1.8" />
          </svg>
        </button>
      </div>

      <label class="displayFlex align-itemsCenter gap8px color#4a4a4a font-size16px margin-bottom22px">
        <input type="checkbox" checked class="width16px height16px" />
        <span>Ghi nhớ tài khoản</span>
      </label>

      <button type="button"
        class="width100% height40px borderNone border-radius999px background-color#0a64e8 color#ffffff font-size18px font-weight500 margin-bottom22px cursorPointer">
        Đăng nhập
      </button>

      <a href="#" class="displayBlock text-alignCenter color#0a5f9f font-size16px text-decorationNone">Đăng nhập bằng mã
        QR</a>
    </section>

    <footer class="width410px displayFlex align-itemsCenter justify-contentSpace-between margin-top8px">
      <button type="button"
        class="width120px height32px displayFlex align-itemsCenter justify-contentSpace-between padding-left10px padding-right10px border1px;solid;#b1b1b1 border-radius6px background-color#f3f3f3 color#505050 font-size14px cursorPointer">
        <span>Tiếng Việt</span>
        <span>▼</span>
      </button>

      <div class="displayFlex gap14px color#4b4b4b font-size16px">
        <a href="#" class="color#4b4b4b text-decorationNone">Hỗ trợ</a>
        <a href="#" class="color#4b4b4b text-decorationNone">Điều khoản dịch vụ</a>
      </div>
    </footer>
  </div>

  <script type="module">
    import xcss from './dist/index.mjs'

    try {
      localStorage.removeItem('xcss_cache_v1')
    } catch (error) {
      console.warn('Cannot clear xcss cache:', error)
    }

    xcss.cssObserve(document, {
      dictionaryImport: false
    })
  </script>
</body>

</html>
